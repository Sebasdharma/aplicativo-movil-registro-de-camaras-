# Compila el APK de AsisTech en GitHub y lo publica en "Releases".
# Se ejecuta en cada push a main o a la rama de trabajo, o a mano desde
# la pestaña Actions -> "Compilar APK" -> "Run workflow".
name: Compilar APK

on:
  push:
    branches: [main, claude/relaxed-rubin-8pikhp]
    paths:
      - "aplicativo-movil-registro-de-camaras--main/mobile_app/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: aplicativo-movil-registro-de-camaras--main/mobile_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Renombrar APK
        id: apk
        run: |
          nombre="AsisTech-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$nombre"
          echo "ruta=aplicativo-movil-registro-de-camaras--main/mobile_app/$nombre" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AsisTech-apk
          path: ${{ steps.apk.outputs.ruta }}

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AsisTech APK ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          files: ${{ steps.apk.outputs.ruta }}
          body: |
            APK compilado automáticamente desde `${{ github.ref_name }}` (commit ${{ github.sha }}).
            Descárgalo desde el celular e instálalo. Si ya tienes AsisTech instalado
            con otro APK, desinstálalo primero.
