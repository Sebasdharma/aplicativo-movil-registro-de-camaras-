# Compila el APK de "AsisTech Cámara" para el Galaxy J2 y lo publica en "Releases".
# La dirección del servidor queda fija dentro del APK: para otra IP, ve a
# Actions -> "Compilar APK J2" -> "Run workflow" y escribe la dirección.
name: Compilar APK J2

on:
  push:
    branches: [main, claude/relaxed-rubin-8pikhp]
    paths:
      - "aplicativo-movil-registro-de-camaras--main/j2_camera_app/**"
      - ".github/workflows/apk-j2.yml"
  workflow_dispatch:
    inputs:
      servidor:
        description: "Dirección del backend (ej. http://192.168.1.25:5000)"
        required: true
        default: "http://172.20.245.88:5000"

permissions:
  contents: write

concurrency:
  group: apk-j2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-j2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: aplicativo-movil-registro-de-camaras--main/j2_camera_app
    env:
      SERVIDOR: ${{ github.event.inputs.servidor || 'http://172.20.245.88:5000' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.1.0"

      - name: Compilar APK J2
        run: gradle assembleRelease --no-daemon -PcameraApiBaseUrl="$SERVIDOR"

      - name: Renombrar APK
        id: apk
        run: |
          nombre="AsisTech-Camara-J2-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$nombre"
          echo "ruta=aplicativo-movil-registro-de-camaras--main/j2_camera_app/$nombre" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: AsisTech-Camara-J2-apk
          path: ${{ steps.apk.outputs.ruta }}

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-j2-${{ github.run_number }}
          name: AsisTech Cámara J2 ${{ github.run_number }} (servidor ${{ env.SERVIDOR }})
          prerelease: true
          files: ${{ steps.apk.outputs.ruta }}
          body: |
            APK para el Galaxy J2 (Android 5.1.1), compilado desde `${{ github.ref_name }}`.
            Servidor configurado: `${{ env.SERVIDOR }}`. El J2 debe estar en la misma Wi-Fi
            que la PC que ejecuta `python server.py`, y esa PC debe tener esa IP.
