plugins {
    id "com.android.application"
}

def apiBaseUrl = (project.findProperty("cameraApiBaseUrl") ?: "https://asistech-upec-backend.onrender.com")
        .toString()
        .replaceAll("/+\$", "")

android {
    namespace "com.upec.asistech.j2camera"
    compileSdk 36

    defaultConfig {
        applicationId "com.upec.asistech.j2camera"
        minSdk 22
        targetSdk 28
        versionCode 10
        versionName "1.0.10"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    lint {
        disable "ExpiredTargetSdkVersion"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:3.12.13"
    implementation "org.conscrypt:conscrypt-android:2.9.0"
}
